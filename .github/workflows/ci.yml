name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.1"
          - "8.3"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Check PHP syntax
        run: find plugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  sandbox-config:
    name: Sandbox configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: cp .env.example .env && sed -i 's/replace-with-[^ ]*/local-ci-value/g' .env && docker compose config --quiet
